<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Claude Project Setup workflow" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Claude Project Setup workflow</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="250" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="24" y="40" font-size="20" font-weight="650" fill="#0f172a" text-anchor="start">From a description to a verified Claude Code setup</text>
<text x="24" y="64" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">Scripts do the repetitive work. Nothing is written until you approve the plan.</text>
<rect x="24" y="92" width="128" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<circle cx="46" cy="116" r="12" fill="#0f172a"/>
