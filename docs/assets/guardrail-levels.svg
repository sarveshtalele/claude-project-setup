<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Guardrail levels: light, standard, strict" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Guardrail levels: light, standard, strict</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="330" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<text x="24" y="40" font-size="20" font-weight="650" fill="#0f172a" text-anchor="start">Guardrail levels</text>
<text x="24" y="64" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">Each level adds to the one before it. Every rule is enforced by a hook, not just requested in a prompt.</text>
<rect x="24" y="88" width="368" height="222" rx="14" fill="#f8fafc" stroke="#64748b"/>
<text x="46" y="122" font-size="18" font-weight="700" fill="#64748b" text-anchor="start">Light</text>
<text x="46" y="144" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Prototypes and experiments</text>
<circle cx="52" cy="175" r="4" fill="#64748b"/>
<text x="66" y="180" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">Guard: protected paths, dangerous shell</text>
<circle cx="52" cy="205" r="4" fill="#64748b"/>
<text x="66" y="210" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">Ask before creating new files</text>
<circle cx="52" cy="235" r="4" fill="#64748b"/>
<text x="66" y="240" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">State injected after /clear</text>
<rect x="416" y="88" width="368" height="222" rx="14" fill="#eef2ff" stroke="#4f46e5"/>
<text x="438" y="122" font-size="18" font-weight="700" fill="#4f46e5" text-anchor="start">Standard</text>
<text x="438" y="144" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Default for most projects</text>
<circle cx="444" cy="175" r="4" fill="#4f46e5"/>
<text x="458" y="180" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">Everything in Light</text>
<circle cx="444" cy="205" r="4" fill="#4f46e5"/>
<text x="458" y="210" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">Stop gate keeps STATE.md current</text>
<circle cx="444" cy="235" r="4" fill="#4f46e5"/>
<text x="458" y="240" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">Approvals only from your messages</text>
<circle cx="444" cy="265" r="4" fill="#4f46e5"/>
<text x="458" y="270" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">Task state machines</text>
<rect x="808" y="88" width="368" height="222" rx="14" fill="#ecfdf5" stroke="#047857"/>
<text x="830" y="122" font-size="18" font-weight="700" fill="#047857" text-anchor="start">Strict</text>
<text x="830" y="144" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Production code and teams</text>
<circle cx="836" cy="175" r="4" fill="#047857"/>
<text x="850" y="180" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">Everything in Standard</text>
<circle cx="836" cy="205" r="4" fill="#047857"/>
<text x="850" y="210" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">Edits limited to the task's files</text>
<circle cx="836" cy="235" r="4" fill="#047857"/>
<text x="850" y="240" font-size="14" font-weight="400" fill="#0f172a" text-anchor="start">Fast tests run before Claude stops</text>
</svg>
